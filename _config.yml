# 60 Words About the Author
author-about: <p>The 3MC - PIMS - IDMS - ICMS Summer School is co-organised under the umbrellas of 3MC, PIMS and ICMS. It is funded by PIMS and, as an Increasing Diversity in Mathematical Sciences (IDMS) Summer School, through AARMS, CRM, Fields Institute and PIMS.</p> <p>It will be held in on the Fort Garry campus of the University of Manitoba in <a href="https://www.meetingswinnipeg.com/conference/3mc-pims-idms-icms-summer-school">Winnipeg</a>, from 16 to 27 June 2025. Topics of the school are quantitative molecular and cellular biology.</p> <p>The University of Manitoba campuses and research spaces are located on original lands of Anishinaabeg, Ininiwak, Anisininewuk, Dakota Oyate, Dene and Inuit, and on the National Homeland of the Red River Métis.</p> <p>We respect the Treaties that were made on these territories, we acknowledge the harms and mistakes of the past, and we dedicate ourselves to move forward in partnership with Indigenous communities in a spirit of Reconciliation and collaboration. </p>
author-about-short: School on Quantitative molecular and cellular biology, Winnipeg 16-27 June 2025. 
